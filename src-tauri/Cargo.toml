[package]
name = "thorium-workspace"
description = "Portable Windows workspace for Thorium browser profiles, accounts and two-factor authentication."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
default-run = "thorium-workspace"

[lib]
name = "thorium_workspace_lib"
crate-type = ["lib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tw-controller = { workspace = true }
tw-domain = { workspace = true }
tw-secrets = { workspace = true }
tw-otp = { workspace = true }
tw-qr = { workspace = true }
tw-thorium = { workspace = true }
tw-vault = { workspace = true }
tw-windows-platform = { workspace = true }
tauri = { version = "2" }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }

[features]
# Tauri's own convention for enabling devtools in a release build. Off by
# default: a shipped desktop utility should not offer a web inspector.
custom-protocol = ["tauri/custom-protocol"]
